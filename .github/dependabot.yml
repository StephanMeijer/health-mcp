# Keeps the SHA-pinned actions (see .github/workflows/actions.lock), the Cargo dependencies, the Rust version
# (rust-toolchain.toml), the Dockerfile base images and the web app's npm packages up to date. A Rust bump comes as two PRs (toolchain and
# Dockerfile tag). rust-toolchain.toml picks the compiler everywhere, so merge them together only to keep the image
# build from downloading a second toolchain.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Conventional subjects, which release-plz turns into the changelog.
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    # Node majors follow the LTS line by hand (web/.nvmrc and package.json engines move with them).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    # One PR for the routine bumps, so the web app doesn't drown the queue.
    groups:
      web:
        patterns: ["*"]
        update-types: ["minor", "patch"]
