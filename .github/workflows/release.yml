# Builds and pushes the Docker image for a release tag.
#
# release-plz (ci.yml) pushes the tag with GITHUB_TOKEN, and GitHub does not fire
# `push` workflows for those, so ci.yml dispatches this workflow against the tag.
# The tag trigger covers tags pushed by hand.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      ref: ${{ github.ref }}
      tag_name: ${{ github.ref_name }}
    secrets: inherit
