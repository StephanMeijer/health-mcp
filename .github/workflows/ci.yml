name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, so a new RustSec advisory against a shipped dependency fails the audit job even when nobody pushes.
  schedule:
    - cron: '17 6 * * 1'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  # Per event, so a scheduled run never replaces a queued push run on main (the one that tags a release).
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Same image and port as compose.yaml (pinned to production's TimescaleDB), so the tests' default URLs work unchanged.
      postgres:
        image: timescale/timescaledb:2.31.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitals
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # Service containers can't mount repo files, so the dev login roles are created here.
      - run: psql postgres://postgres:postgres@localhost:55432/vitals -v ON_ERROR_STOP=1 -f dev/init.sql
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo test --locked

  clippy:
    # Fork PRs run untrusted build.rs / proc macros / rust-toolchain.toml: keep them off self-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || '9xx' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.3
      - run: cargo clippy --locked --all-targets -- -D warnings

  fmt:
    # Fork PRs run untrusted build.rs / proc macros / rust-toolchain.toml: keep them off self-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || '9xx' }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  # Known vulnerabilities in the dependency tree; deny.toml lists the ones that don't reach us, and why.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check advisories

  # Build (don't push) both arches so a broken Dockerfile can't get tagged.
  docker-build:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/docker.yml
    with:
      push: false
    permissions:
      contents: read

  # Tags vX.Y.Z + creates the GitHub release when Cargo.toml's version has no tag yet
  # (i.e. right after a release PR merges). No `concurrency:` here: a cancelled
  # release run would leave the version untagged until the next push.
  release-plz-release:
    name: Tag and release
    needs: [test, clippy, fmt, audit, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'StephanMeijer/vitals-mcp'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      actions: write # dispatch release.yml
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release)
        id: release-plz
        uses: release-plz/action@v0.5.148
        with:
          command: release
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dispatch release.yml for the new tag
        if: steps.release-plz.outputs.releases_created == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(printf '%s' "$RELEASES" | jq -r '..|.tag? // empty | select(test("^v[0-9]"))' | head -n1)
          if [ -n "$tag" ]; then
            echo "Dispatching release.yml against $tag"
            gh workflow run release.yml --ref "$tag" --repo "$GITHUB_REPOSITORY"
          else
            echo "No vX.Y.Z tag in release-plz output"
          fi

  # Opens/updates the release PR (version bump + CHANGELOG from conventional commits).
  release-plz-pr:
    name: Release PR
    needs: [release-plz-release]
    if: >-
      !cancelled()
      && github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'StephanMeijer/vitals-mcp'
      && contains(fromJSON('["success", "failure"]'), needs.release-plz-release.result)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz (release-pr)
        uses: release-plz/action@v0.5.148
        with:
          command: release-pr
          config: release-plz.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
