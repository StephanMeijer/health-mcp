# Dev/test database only. Production runs TimescaleDB elsewhere.
services:
  db:
    image: timescale/timescaledb:latest-pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitals
    ports: ["55432:5432"]
    volumes: ["./dev/init.sql:/docker-entrypoint-initdb.d/zz-vitals.sql:ro"]
