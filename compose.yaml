# Dev/test database only. Production runs TimescaleDB elsewhere; keep this tag (and ci.yml's) at its version.
services:
  db:
    image: timescale/timescaledb:2.31.0-pg17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vitals
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./dev/init.sql:/docker-entrypoint-initdb.d/zz-vitals.sql:ro"]
